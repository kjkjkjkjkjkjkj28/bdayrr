<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Test Page</title>
    <style>
        body { 
            background-color: #0f172a; 
            color: #ffffff; 
            font-family: system-ui, -apple-system, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container { 
            background-color: #1e293b; 
            padding: 40px; 
            border-radius: 24px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 2px solid #334155;
        }
        h1 { 
            color: #f43f5e; 
            font-size: 2.5rem; 
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            font-size: 1.1rem;
            line-height: 1.5;
        }
        .btn { 
            background-color: #f43f5e; 
            color: white; 
            padding: 14px 28px; 
            border: none; 
            border-radius: 50px; 
            font-size: 1.2rem; 
            font-weight: bold;
            cursor: pointer; 
            margin-top: 25px; 
            transition: transform 0.2s;
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
        }
        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>It Works! 🎈</h1>
        <p>Your live GitHub Pages website is officially styled, colorized, and running perfectly on the internet.</p>
        <button class="btn" onclick="alert('🎉 Confetti Burst! Website Is Live! 🎉')">Tap For Surprise</button>
    </div>
</body>
</html>
