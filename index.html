<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise!</title>
    <style>
        body { background: #1a1a2e; color: #fff; font-family: sans-serif; text-align: center; padding: 50px; }
        .card { background: #16213e; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: inline-block; }
        h1 { color: #e94560; font-size: 3em; }
        .btn { background: #e94560; color: #fff; padding: 10px 20px; border: none; border-radius: 5px; font-size: 1.2em; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Happy Birthday! 🎈</h1>
        <p>Your interactive site is officially fully styled and online!</p>
        <button class="btn" onclick="alert('🎉 Confetti Burst! 🎉')">Click for Surprise</button>
    </div>
</body>
</html>
